pull_request_rules:
  - name: probe qualified pep8 (github-actions) - masking survives qualification?
    conditions:
      - base=main
      - check-success=@github-actions/pep8
    actions:
      label:
        add:
          - qualified-pep8-matched
  - name: probe qualified solo-ci (github-actions) - pure status attributed to slug?
    conditions:
      - base=main
      - check-success=@github-actions/solo-ci
    actions:
      label:
        add:
          - qualified-soloci-matched
  - name: NEGATIVE control - wrong producer mergify should not match github-actions signal
    conditions:
      - base=main
      - check-success=@mergify/pep8
    actions:
      label:
        add:
          - wrongproducer-mergify-matched
