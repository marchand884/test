pull_request_rules:
  - name: mergify self-approve (PoC)
    conditions:
      - base=main
    actions:
      review:
        type: APPROVE
        message: "Auto-approved by Mergify (self-approval PoC)"
  - name: auto-merge on approval (PoC)
    conditions:
      - base=main
      - "#approved-reviews-by>=1"
    actions:
      merge:
        method: merge
