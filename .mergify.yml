pull_request_rules:
  - name: q2 name-only resolution (fake-ci from actions token)
    conditions:
      - check-success=fake-ci
    actions:
      label:
        add:
          - q2-fakeci-satisfied
  - name: q2 status overwrites failing check-run (ov-test)
    conditions:
      - check-success=ov-test
    actions:
      label:
        add:
          - q2-ovtest-satisfied
