name: gate
on: pull_request
permissions:
  statuses: write
  checks: write
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: create FAILING check-run ci-gate (the real CI verdict)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          curl -sS -X POST -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/check-runs" \
            -d "{\"name\":\"ci-gate\",\"head_sha\":\"$SHA\",\"status\":\"completed\",\"conclusion\":\"failure\",\"output\":{\"title\":\"CI FAILED\",\"summary\":\"tests failed\"}}"
      - name: post MASKING success commit-status ci-gate (same name)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          curl -sS -X POST -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d "{\"context\":\"ci-gate\",\"state\":\"success\",\"description\":\"masking status\"}"
      - name: GROUND-TRUTH dump (token-authenticated)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo '### GROUND-TRUTH check-runs on '"$SHA"
            echo '```'
            curl -sS -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/$REPO/commits/$SHA/check-runs" \
              | python3 -c 'import sys,json;d=json.load(sys.stdin);[print("check-run name=%s status=%s conclusion=%s"%(c["name"],c["status"],c["conclusion"])) for c in d["check_runs"]]'
            echo '```'
            echo '### GROUND-TRUTH commit-statuses on '"$SHA"
            echo '```'
            curl -sS -H "Authorization: token $GH_TOKEN" "https://api.github.com/repos/$REPO/commits/$SHA/statuses" \
              | python3 -c 'import sys,json;[print("status context=%s state=%s"%(s["context"],s["state"])) for s in json.load(sys.stdin)]'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
